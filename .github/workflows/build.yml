name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clearwork
          POSTGRES_PASSWORD: clearwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Genera apps/api/coverage/lcov.info, que sonar-project.properties
      # ya apunta a leer (sonar.javascript.lcov.reportPaths). Sin este
      # paso, SonarCloud analiza el código pero marca 0% de cobertura.
      - name: Tests de integración (apps/api), con cobertura
        run: npm run test:api:coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
