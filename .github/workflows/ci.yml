name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clearwork
          POSTGRES_PASSWORD: clearwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests de integración (apps/api), con cobertura
        run: npm run test:api:coverage

      - name: Compilar apps/api
        run: npm run build:api

      - name: Compilar apps/web
        run: npm run build:web
