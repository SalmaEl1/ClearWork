name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      # Expuesto a nivel de job para poder comprobarlo en el `if` del
      # paso de SonarCloud (los steps no pueden leer `secrets` en su
      # propio `if`, solo `env`).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clearwork
          POSTGRES_PASSWORD: clearwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Historial completo: SonarCloud lo necesita para el análisis
          # de "new code" y el blame por línea.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests de integración (apps/api), con cobertura
        run: npm run test:api:coverage

      - name: Compilar apps/api
        run: npm run build:api

      - name: Compilar apps/web
        run: npm run build:web

      - name: SonarCloud Scan
        # Se salta sin fallar el job hasta que exista el secret
        # SONAR_TOKEN (hace falta una cuenta de SonarCloud, ver README).
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
