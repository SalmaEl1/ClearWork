name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clearwork
          POSTGRES_PASSWORD: clearwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests de integración (apps/api)
        run: npm run test:api

      - name: Compilar apps/api
        run: npm run build:api

      - name: Compilar apps/web
        run: npm run build:web
