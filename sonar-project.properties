# Rellena estas dos claves con las que te asigne SonarCloud al importar
# el repo (Sonarcloud.io > + > Analyze new project > SalmaEl1/ClearWork).
sonar.projectKey=SalmaEl1_ClearWork
sonar.organization=salmahak

sonar.sources=apps/api/src,apps/web/src,packages/shared/src
sonar.tests=apps/api/tests,apps/web/tests
sonar.exclusions=**/dist/**,**/node_modules/**,**/coverage/**
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info
sonar.sourceEncoding=UTF-8
