# Rellena estas dos claves con las que te asigne SonarCloud al importar
# el repo (Sonarcloud.io > + > Analyze new project > SalmaEl1/ClearWork).
sonar.projectKey=SalmaEl1_ClearWork
sonar.organization=salmahak

sonar.sources=apps/api/src,apps/web/src,packages/shared/src
sonar.tests=apps/api/tests,apps/web/tests,packages/shared/tests
sonar.exclusions=**/dist/**,**/node_modules/**,**/coverage/**
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info,packages/shared/coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Fuera del cálculo de cobertura (pero sí analizados para bugs/smells,
# a diferencia de sonar.exclusions): scripts de arranque, migración y
# semillas de datos, que se ejecutan una vez desde la CLI contra una
# base de datos real, no como parte del código de la aplicación en sí
# — probarlos aportaría poco frente al coste de mantenimiento, mismo
# criterio que el punto de entrada y el árbol de rutas del frontend.
sonar.coverage.exclusions=\
  apps/api/src/index.ts,\
  apps/api/src/db/migrate.ts,\
  apps/api/src/db/migrateTest.ts,\
  apps/api/src/db/ensureTestDb.ts,\
  apps/api/src/db/resetTestDb.ts,\
  apps/api/src/db/seedAdmin.ts,\
  apps/api/src/db/seedDemoData.ts,\
  apps/web/src/main.tsx,\
  apps/web/src/router.tsx
